[package]
name = "serienbrief-client"
version = "0.1.0"
edition = "2021"
description = "GUI zum Erzeugen von Serienbrief-PDFs aus einer Word-Vorlage und einer CSV-Datenquelle"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
csv = "1"
md5 = "0.7"
reqwest = { version = "0.12", features = ["blocking", "cookies"] }
serde_json = "1"
eframe = { version = "0.31", features = ["persistence"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
] }

[profile.release]
opt-level = 2
strip = true
